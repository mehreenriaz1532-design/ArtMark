<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Nunito:wght@400;500;600;700;800&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3EFE6; --ink:#1B2438; --mute:#5E6677; --card:#FFFEFA; --line:#DDD5C3;
  --accent:#1F3A68; --on-accent:#FFF9EC; --gold:#B8862F; --field:#FFFFFF; --good:#1F7A4D; --warn:#A5541A; --soft:#EAE4D4;
  --radius:10px; --shadow:0 1px 2px rgba(27,36,56,.06),0 10px 26px rgba(27,36,56,.08);
  --display:'Playfair Display',Georgia,'Times New Roman',serif;
  --body:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;
  --script:'Dancing Script','Brush Script MT','Segoe Script',cursive;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0F1522;--ink:#EFE9DA;--mute:#A4ABBA;--card:#172033;--line:#2B3650;--accent:#D8B25C;--on-accent:#101624;--gold:#E2BE6A;--field:#111A2B;--soft:#1F2A42;--good:#6FD3A0;--warn:#F0A468;--shadow:0 10px 28px rgba(0,0,0,.4)}
}
:root[data-theme="dark"]{--bg:#0F1522;--ink:#EFE9DA;--mute:#A4ABBA;--card:#172033;--line:#2B3650;--accent:#D8B25C;--on-accent:#101624;--gold:#E2BE6A;--field:#111A2B;--soft:#1F2A42;--good:#6FD3A0;--warn:#F0A468;--shadow:0 10px 28px rgba(0,0,0,.4)}

/* a different studio for each category */
body.cat-sketching{--bg:#E8E6E0;--ink:#23262B;--mute:#5E6168;--card:#F8F7F3;--line:#C9C6BC;--accent:#2F3A4A;--on-accent:#fff;--gold:#8A6A2A;--field:#fff;--soft:#DFDDD5;--good:#1F7A4D;--warn:#A5541A;--shadow:0 1px 2px rgba(0,0,0,.06),0 8px 20px rgba(40,40,40,.09);
  background-image:repeating-linear-gradient(115deg,rgba(60,60,60,.07) 0 1px,transparent 1px 8px),repeating-linear-gradient(25deg,rgba(60,60,60,.04) 0 1px,transparent 1px 11px)}
body.cat-oil{--bg:#2B1C13;--ink:#F4E8D5;--mute:#CDB89D;--card:#3A2618;--line:#5D4029;--accent:#E3AE48;--on-accent:#2B1C13;--gold:#F0C766;--field:#2B1C13;--soft:#4A3220;--good:#8FD8A8;--warn:#F0A468;--shadow:0 10px 26px rgba(0,0,0,.4);
  background-image:repeating-linear-gradient(0deg,rgba(255,235,200,.035) 0 2px,transparent 2px 4px),repeating-linear-gradient(90deg,rgba(255,235,200,.03) 0 2px,transparent 2px 4px),linear-gradient(160deg,#2B1C13,#4B2F1B 70%,#5A3820)}
body.cat-charcoal{--bg:#17181B;--ink:#E7E7E9;--mute:#A0A2A8;--card:#222327;--line:#37393F;--accent:#D8DBE2;--on-accent:#17181B;--gold:#E6D3A0;--field:#17181B;--soft:#2D2F35;--good:#8FD8A8;--warn:#F0A468;--shadow:0 10px 26px rgba(0,0,0,.45);
  background-image:radial-gradient(ellipse at 15% 20%,rgba(255,255,255,.07),transparent 45%),radial-gradient(ellipse at 85% 65%,rgba(255,255,255,.05),transparent 50%),radial-gradient(ellipse at 40% 95%,rgba(255,255,255,.06),transparent 40%)}

*,*::before,*::after{box-sizing:inherit}
body{margin:0;background-color:var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;transition:background-color .4s,color .3s}
h1,h2,h3{font-family:var(--display);line-height:1.12;margin:0 0 .5em;letter-spacing:-.015em;text-wrap:balance;font-optical-sizing:auto}
h1{font-size:clamp(2.1rem,5.2vw,3.5rem);font-weight:800}
h2{font-size:clamp(1.35rem,2.6vw,1.75rem);font-weight:700}
h3{font-size:1.08rem;font-weight:700}
p{margin:0 0 .8em;text-wrap:pretty}
a{color:var(--accent);text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
b,.tiles b,.stars,.lb b{font-variant-numeric:tabular-nums}
.wrap{max-width:1200px;margin:0 auto;padding:0 22px}
.muted{color:var(--mute)} .small{font-size:.86rem}
.lead{font-size:1.1rem;max-width:54ch;color:var(--mute)}
.ulink{color:inherit;font-weight:600;text-decoration:none}.ulink:hover{text-decoration:underline}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:18px;padding:10px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:1.55rem;text-decoration:none;color:var(--ink);letter-spacing:-.02em}
.brand i{font-style:normal;color:var(--accent)}
.brand svg{width:28px;height:28px}
nav.main{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
nav.main a{display:flex;align-items:center;gap:6px;padding:8px 12px;text-decoration:none;color:var(--mute);font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;position:relative}
nav.main a:hover{color:var(--ink)}
nav.main a.on{color:var(--ink);border-color:var(--accent)}
nav.main .ic{font-size:1rem}
.bdg{background:var(--accent);color:var(--on-accent);font-size:.68rem;font-weight:700;border-radius:99px;min-width:18px;height:18px;display:inline-grid;place-items:center;padding:0 5px}
.who{display:flex;align-items:center;gap:10px}
.chip{border:1px solid var(--line);padding:4px 12px;font-size:.84rem;background:var(--bg);border-radius:99px;white-space:nowrap}
.av{width:var(--s,36px);height:var(--s,36px);border-radius:50%;background:hsl(var(--h) 42% 40%);color:#fff;display:inline-grid;place-items:center;font-weight:700;font-size:calc(var(--s,36px)*.42);flex:none;font-family:var(--display)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;display:grid;place-items:center;font-size:1rem}
.iconbtn:hover{background:var(--soft)}

.btn{background:var(--accent);color:var(--on-accent);border:0;padding:10px 18px;font-weight:600;cursor:pointer;border-radius:8px;transition:transform .12s,filter .2s;font-size:.95rem}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.btn.sm{padding:6px 12px;font-size:.84rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.cats{display:flex;gap:8px;padding:16px 0 4px;flex-wrap:wrap}
.cats button{border:1px solid var(--line);background:var(--card);padding:7px 16px;cursor:pointer;border-radius:99px;font-weight:500}
.cats button:hover{background:var(--soft)}
.cats button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:30px;padding:26px 0 14px;align-items:start}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin:18px 0 0}
.stats div{font-size:.85rem;color:var(--mute)} .stats b{display:block;font-family:var(--display);font-size:1.5rem;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.layout{display:grid;grid-template-columns:1fr 310px;gap:26px;padding-bottom:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:18px}
.art{position:relative;overflow:hidden;transition:transform .2s,border-color .2s}
.art:hover{transform:translateY(-3px);border-color:var(--accent)}
.art .thumb{display:block;width:100%;padding:0;border:0;background:var(--soft);cursor:pointer;position:relative;aspect-ratio:4/3;overflow:hidden}
.art .thumb img,.art .thumb video{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.art:hover .thumb img{transform:scale(1.04)}
.badge{position:absolute;left:10px;top:10px;background:#000b;color:#fff;font-size:.74rem;padding:3px 9px;border-radius:99px}
.fav{position:absolute;right:10px;top:10px;background:#000a;border:0;color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1.05rem;display:grid;place-items:center}
.fav.on{color:#ff5d73}
.art .meta{padding:12px 15px 14px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.stars{color:var(--accent);letter-spacing:2px;white-space:nowrap}
.tag{font-size:.76rem;border:1px solid var(--line);padding:1px 9px;border-radius:99px;color:var(--mute);white-space:nowrap}
.lb{margin:0;padding:0}.lb li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);list-style:none;align-items:center}
.lb li:last-child{border:0}
.task{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.task.done{color:var(--good)}
.bar-track{background:var(--line);height:10px;border-radius:99px;overflow:hidden}
.bar-fill{background:var(--accent);height:100%;border-radius:99px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 18px}
.toolbar input,.toolbar select{padding:9px 12px;background:var(--field);border:1px solid var(--line);border-radius:8px}
.toolbar input{flex:1;min-width:180px}
.empty{padding:34px 20px;text-align:center;color:var(--mute)}

/* forms + modal */
.f{display:block;margin-bottom:13px;font-weight:600;font-size:.9rem}
.f input,.f select,.f textarea{display:block;width:100%;margin-top:5px;padding:10px 12px;background:var(--field);border:1px solid var(--line);border-radius:8px;font-weight:400}
.f textarea{min-height:84px;resize:vertical}
.f small{font-weight:400;color:var(--mute)}
.chk{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:.92rem}
#modal{position:fixed;inset:0;background:#000b;z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(20px,env(safe-area-inset-top,0px)) 14px 30px;animation:fade .18s}
#modal[hidden]{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mbox{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;width:100%;max-width:480px;padding:24px;position:relative;margin-top:4vh;box-shadow:var(--shadow)}
.mbox.wide{max-width:900px}
.mbox .x{position:absolute;right:12px;top:8px;background:none;border:0;font-size:1.7rem;cursor:pointer;color:var(--mute);line-height:1}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:22px}
.two img,.two video{width:100%;display:block;border-radius:10px}
.cm{border-top:1px solid var(--line);padding:10px 0}
.rate button{background:none;border:0;font-size:1.8rem;cursor:pointer;color:var(--line);padding:0 2px}
.rate button.on{color:var(--accent)}
.err{color:var(--warn);font-size:.9rem;min-height:1.2em}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tabs button{flex:1;padding:9px;border:1px solid var(--line);background:transparent;cursor:pointer;border-radius:8px;font-weight:600}
.tabs button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;z-index:60;max-width:90vw;font-size:.92rem;box-shadow:var(--shadow)}
#toast[hidden]{display:none}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.sbtn{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);background:var(--bg);font-weight:600;font-size:.9rem;cursor:pointer}
.sbtn:hover{border-color:var(--accent);background:var(--soft)}
.sbtn.wa{background:#25D366;color:#073b1a;border-color:#25D366}
.linkbox{display:flex;gap:8px}.linkbox input{flex:1;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--field)}

/* battles / commissions */
.battle{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.battle img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border-radius:10px}
.ms{display:grid;grid-template-columns:34px 1fr auto;gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem}
.dot.active{border-color:var(--accent)} .dot.released{background:var(--good);border-color:var(--good);color:#fff}
.dot.submitted{border-color:var(--warn)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
.tile b{display:block;font-family:var(--display);font-size:2rem}
.sect{padding:10px 0 30px}
.notice{border:1px dashed var(--line);padding:11px 15px;font-size:.88rem;color:var(--mute);margin:14px 0;border-radius:10px}
footer{padding:26px 0 40px;color:var(--mute);font-size:.85rem}

/* chat */
.seg{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.seg a{padding:7px 18px;text-decoration:none;color:var(--ink);font-weight:600;font-size:.9rem}
.seg a.on{background:var(--accent);color:var(--on-accent)}
.chat{display:grid;grid-template-columns:300px 1fr;height:min(640px,calc(100vh - 220px));min-height:480px;overflow:hidden}
.threads{border-right:1px solid var(--line);overflow-y:auto}
.threads a{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.threads a.on{background:var(--soft)}
.threads .tx{min-width:0;flex:1}.threads .tx span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0}
.chead{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chead .grow{flex:1;min-width:140px}
#msgs{padding:16px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.day{align-self:center;font-size:.75rem;color:var(--mute);background:var(--card);border:1px solid var(--line);padding:2px 12px;border-radius:99px;margin:8px 0}
.msg{max-width:78%;padding:9px 13px;border-radius:16px;background:var(--card);border:1px solid var(--line);position:relative;word-wrap:break-word;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-color:var(--accent);border-bottom-right-radius:4px}
.msg:not(.me){border-bottom-left-radius:4px}
.msg.me a{color:inherit}
.msg .tm{font-size:.7rem;opacity:.7;margin-top:2px}
.msg.gone{font-style:italic;opacity:.65}
.mm{position:absolute;top:2px;right:6px;background:none;border:0;cursor:pointer;opacity:0;font-size:1rem;color:inherit;padding:0 4px}
.msg:hover .mm,.msg.open .mm{opacity:.8}
.mact{display:none;gap:6px;flex-wrap:wrap;margin-top:6px}
.msg.open .mact{display:flex}
.mact button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:99px;padding:2px 10px;font-size:.76rem;cursor:pointer}
.xcard{display:flex;gap:10px;align-items:center;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px;margin:2px 0}
.xcard img{width:64px;height:48px;object-fit:cover;border-radius:6px}
.xcard a{color:var(--accent)}
.composer{border-top:1px solid var(--line);padding:10px 12px;background:var(--card);position:relative}
.composer form{display:flex;gap:8px;align-items:center}
.composer input{flex:1;padding:11px 14px;background:var(--field);border:1px solid var(--line);border-radius:99px;min-width:0}
.ib{background:none;border:0;font-size:1.35rem;cursor:pointer;padding:4px;border-radius:50%}
.ib:hover{background:var(--soft)}
.emo{position:absolute;left:10px;bottom:62px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;box-shadow:var(--shadow);z-index:5;max-width:calc(100% - 20px)}
.emo[hidden]{display:none}
.emo button{background:none;border:0;font-size:1.4rem;cursor:pointer;border-radius:8px;padding:3px}
.emo button:hover{background:var(--soft)}
.crow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.crow .tx{flex:1;min-width:180px}

/* responsive */
@media (max-width:900px){
  .hero,.layout,.two{grid-template-columns:1fr}
  .chat{grid-template-columns:1fr;height:auto}
  .threads{border-right:0;border-bottom:1px solid var(--line);display:flex;overflow-x:auto}
  .threads a{min-width:210px;border-bottom:0;border-right:1px solid var(--line)}
  #msgs{height:52vh;flex:none}
}
@media (max-width:600px){
  .wrap{padding:0 14px}
  body{padding-bottom:72px}
  .bar{gap:8px}
  .who{margin-left:auto}
  .chip{display:none}
  nav.main{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);justify-content:space-around;gap:0;padding:4px 0 calc(4px + env(safe-area-inset-bottom,0px));overflow:visible}
  nav.main a{flex-direction:column;gap:0;font-size:.66rem;padding:4px 2px;border:0;flex:1;justify-content:center;text-align:center}
  nav.main a.on{color:var(--accent);font-weight:700}
  nav.main .ic{font-size:1.25rem}
  nav.main .bdg{position:absolute;top:0;right:18%}
  .grid{grid-template-columns:1fr 1fr;gap:12px}
  .battle{grid-template-columns:1fr}
  .mbox{padding:18px}
  .ms{grid-template-columns:30px 1fr}.ms .side{grid-column:2}
  .msg{max-width:90%}
  .emo{grid-template-columns:repeat(6,1fr)}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:380px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== v4: classic professional polish ===== */
body{font-family:var(--body);font-weight:500;letter-spacing:.005em}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.01em}
h1{font-weight:800}
.script{font-family:var(--script);font-weight:700;color:var(--gold);font-size:1.12em;letter-spacing:0;white-space:nowrap}
.kicker{font-family:var(--script);font-size:1.5rem;color:var(--gold);margin:0 0 2px;font-weight:700}
.ornament{display:flex;align-items:center;gap:12px;color:var(--gold);margin:6px 0 14px}
.ornament::before,.ornament::after{content:"";height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);flex:1;opacity:.6}
.stars,.rate button.on{color:var(--gold)}
.rate button{font-size:1.9rem;transition:transform .18s cubic-bezier(.3,1.8,.5,1),color .2s}
.rate button:hover{transform:scale(1.3) rotate(-8deg)}
header.top{box-shadow:inset 0 3px 0 var(--gold)}
.brand{font-family:var(--script);font-size:2.1rem;font-weight:700;letter-spacing:0;line-height:1}
.brand i{color:var(--gold)}
.brand svg path{stroke:var(--gold)}.brand svg circle{fill:var(--accent)}
.brand:hover svg{animation:wiggle .7s ease}
nav.main a{font-weight:700;font-size:.95rem}
nav.main a::after{content:"";position:absolute;left:12px;right:12px;bottom:-2px;height:2px;background:var(--gold);transform:scaleX(0);transition:transform .25s}
nav.main a:hover::after,nav.main a.on::after{transform:scaleX(1)}
nav.main a.on{border-color:transparent}

(function(){

  var session=null;

      get:async function(){var r=await SB.from('docs').select('path,data').eq('path',path).maybeSingle();if(r.error)throw fail(r.error);return snapDoc(path,r.data)},

      if(lim)ds=ds.slice(0,lim);
      var docs=ds.map(function(r){return snapDoc(r.path,r)});
      return {docs:docs,size:docs.length,empty:!docs.length};
    }
    return self;
  }
  var DB={doc:docRef,collection:colRef};

  /* people */
  var avatar=function(name){var n=(name||'?').trim()[0]||'?',h=0;for(var i=0;i<(name||'').length;i++)h=(h+name.charCodeAt(i)*37)%360;
    var svg="<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'><rect width='64' height='64' fill='hsl("+h+",42%,40%)'/><text x='32' y='42' text-anchor='middle' font-family='sans-serif' font-size='28' font-weight='700' fill='white'>"+n.toUpperCase().replace(/[<>&]/g,'')+"</text></svg>";
    return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg)};
  var prof=function(r){return {id:r.id,name:r.name||'Artist',avatarUrl:avatar(r.name),color:'#1F3A68'}};
  var USER={
    id:async function(){return session&&session.user?session.user.id:null},
    me:async function(){var id=session.user.id,r=await SB.from('profiles').select('id,name').eq('id',id).maybeSingle(),md=session.user.user_metadata||{};return prof({id:id,name:(r.data&&r.data.name)||md.name||String(session.user.email).split('@')[0]})},
    profiles:async function(ids){var out={};if(!ids.length)return out;var r=await SB.from('profiles').select('id,name').in('id',ids);(r.data||[]).forEach(function(x){out[x.id]=prof(x)});ids.forEach(function(i){if(!out[i])out[i]=prof({id:i,name:'Artist'})});return out},
    search:async function(q){q=String(q||'').replace(/[%,()]/g,' ').trim();var b=SB.from('profiles').select('id,name').limit(15);if(q)b=b.ilike('name','%'+q+'%');var r=await b;return (r.data||[]).map(prof)}
  };
  window.claude={use:async function(name){await ready;try{var r=await SB.auth.getSession();session=r.data.session}catch(e){}if(name==='db')return session?DB:null;if(name==='user')return session?USER:null;return null}};
})();

/* ---------- seed art ---------- */
function rng(s){return()=>(s=(s*1664525+1013904223)%4294967296)/4294967296}
function seedArt(c,seed){
  const r=rng(seed*9973+7);let b='';

    for(let i=0;i<4;i++)b+=`<ellipse cx="${80+r()*240}" cy="${60+r()*180}" rx="${20+r()*60}" ry="${15+r()*50}" fill="none" stroke="#2b2d31" stroke-width="1.2" opacity=".7"/>`;
  }else if(c==='oil'){
    const pal=[['#1F3A5F','#E3A72F','#C8553D','#F1E3C4','#4C7A5A'],['#5B2A4A','#F08A4B','#F6D168','#2A5D77','#E8DCC0'],['#0F4C5C','#E36414','#FB8B24','#9A031E','#F5E9D0']][seed%3];
    b+=`<rect width="400" height="300" fill="${pal[3]}"/>`;
    for(let i=0;i<16;i++)b+=`<ellipse cx="${r()*400}" cy="${r()*300}" rx="${30+r()*90}" ry="${14+r()*40}" transform="rotate(${r()*60-30} 200 150)" fill="${pal[Math.floor(r()*5)]}" opacity="${.55+r()*.4}"/>`;
  }else{
    b+='<defs><filter id="bl"><feGaussianBlur stdDeviation="9"/></filter></defs><rect width="400" height="300" fill="#202124"/>';
    for(let i=0;i<12;i++)b+=`<ellipse cx="${r()*400}" cy="${r()*300}" rx="${25+r()*80}" ry="${15+r()*45}" fill="#dcdcdc" opacity="${.1+r()*.3}" filter="url(#bl)"/>`;
    for(let i=0;i<30;i++){const x=r()*400,y=r()*300;b+=`<line x1="${x}" y1="${y}" x2="${x+r()*60}" y2="${y+r()*40-20}" stroke="#eee" stroke-width="${.5+r()}" opacity="${.15+r()*.4}"/>`}
  }
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">${b}</svg>`);
}
function seed(){
  const now=Date.now(),D=864e5;
  const P=[['Mira Lefèvre','France',240,'Oil painter chasing harbour light.'],['Kenji Arai','Japan',410,'Charcoal portraits and quiet streets.'],['Sana Iqbal','Pakistan',95,'Sketching the old bazaars of my city.'],['Luca Bianchi','Italy',170,'Fresco-inspired colour studies.'],['Ava Thompson','United States',60,'Learning oils, one layer at a time.'],['Omar Khalil','Egypt',320,'Ink, charcoal and desert skies.']];

    const rr=rng(n*31+5);
    users.filter(x=>x.id!==u.id).slice(0,3+Math.floor(rr()*3)).forEach(x=>w.ratings.push({u:x.id,s:3+Math.floor(rr()*3),t:now-Math.floor(rr()*30)*D}));

   .map((l,i)=>({id:'l'+i,uid:l[3],title:l[0],cat:l[1],price:l[2],desc:'Made by a community artist. Ask the seller about size, shipping and custom colours.',img:seedArt(['oil','sketching','charcoal'][i%3],i+40),created:now-i*D}));

async function hash(email,pw){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(email+':'+pw));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){return btoa(unescape(encodeURIComponent(email+':'+pw)))}
}
const eyeField=(label,name,ac,extra='')=>`<label class="f">${label}<span class="pw"><input type="password" name="${name}" required minlength="6" autocomplete="${ac}" ${extra}><button type="button" class="eye" data-act="pwtoggle" aria-label="Show or hide password">👁</button></span></label>`;

  const r=route(),m=me();

/* challenges + battles */
function weekInfo(){

/* ================= LIVE CHAT (shared db, end-to-end encrypted) ================= */
function b64e(buf){const a=new Uint8Array(buf);let s='';for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function encJ(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));return {iv:b64e(iv),ct:b64e(ct)}}
async function decJ(key,iv,ct){const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(iv)},key,b64d(ct));return JSON.parse(new TextDecoder().decode(p))}
async function pinHash(pin,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);return b64e(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64d(salt),iterations:120000,hash:'SHA-256'},k,256))}
const rid=n=>[...crypto.getRandomValues(new Uint8Array(n))].map(x=>'abcdefghjkmnpqrstuvwxyz23456789'[x%31]).join('');
const dataImg=(src,max,q)=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.onerror=()=>rej(new Error('image'));im.src=src});

const C={status:'init',started:false,cdb:null,usr:null,me:null,priv:null,pubJwk:null,kc:new Map(),gk:new Map(),
  threads:[],pf:{},gname:{},prev:{},msgs:[],cur:null,unsubT:null,unsubM:null,mc:new Map(),seq:0,
  prefs:{hidden:{},cleared:{},gone:{},locked:{}},unlocked:new Set(),reply:null,draft:'',blurUntil:0,focused:true,hiddenAt:0,lastShot:0,
  q:Promise.resolve(),readT:null,err:'',pending:null,pendingOpen:null,fails:0,lockedUntil:0,idleT:null};

/* ---- local prefs (device only) ---- */
C.loadPrefs=()=>{try{const p=JSON.parse(localStorage.getItem('artmark_cp_'+C.me));if(p)Object.assign(C.prefs,p)}catch(e){}};
C.savePrefs=()=>{try{localStorage.setItem('artmark_cp_'+C.me,JSON.stringify(C.prefs))}catch(e){}};
C.pinData=()=>{try{return JSON.parse(localStorage.getItem('artmark_pin_'+C.me))}catch(e){return null}};
C.gkStore=()=>{try{return JSON.parse(localStorage.getItem('artmark_gk_'+C.me))||{}}catch(e){return {}}};
C.saveGk=(tid,raw)=>{const s=C.gkStore();s[tid]=b64e(raw);try{localStorage.setItem('artmark_gk_'+C.me,JSON.stringify(s))}catch(e){}C.gk.delete(tid)};

/* ---- helpers ---- */
C.mem=t=>Object.keys(t).filter(k=>k.startsWith('mem_')&&t[k]===true).map(k=>k.slice(4));
C.thr=id=>C.threads.find(t=>t.id===id);
C.other=t=>C.mem(t).find(x=>x!==C.me);
C.nm=id=>id===C.me?'You':((C.pf[id]&&C.pf[id].name)||'Someone');
C.tName=t=>t.type==='dm'?C.nm(C.other(t)):(C.gname[t.id]||'Group');
C.isLocked=id=>!!C.prefs.locked[id]&&!C.unlocked.has(id);
C.unread=t=>!!t.lastFrom&&t.lastFrom!==C.me&&(t.lastT||0)>((t.reads||{})[C.me]||0);
C.unreadN=()=>C.status!=='live'?0:C.visible().filter(C.unread).length;
C.visible=()=>C.threads.filter(t=>!(C.prefs.gone[t.id]&&(t.lastT||0)<=C.prefs.gone[t.id])).filter(t=>t.type==='group'?t['mem_'+C.me]===true:true).sort((a,b)=>(b.lastT||b.created||0)-(a.lastT||a.created||0));
C.resolve=async ids=>{ids=[...new Set(ids)].filter(x=>x&&!C.pf[x]);if(!ids.length)return;try{const p=await C.usr.profiles(ids);ids.forEach(i=>{C.pf[i]=p[i]})}catch(e){}};
C.avatarEl=(id,s=40,group=false,gn='')=>{if(group)return `<span class="av" style="--h:${hue(gn||id)};--s:${s}px" aria-hidden="true">👥</span>`;const p=C.pf[id];return p&&p.avatarUrl?`<img class="av" style="--s:${s}px;object-fit:cover" src="${esc(p.avatarUrl)}" alt="">`:avatar({name:(p&&p.name)||'?'},s)};
C.copy=async txt=>{try{await navigator.clipboard.writeText(txt)}catch(e){const i=document.createElement('input');i.value=txt;document.body.appendChild(i);i.select();try{document.execCommand('copy')}catch(x){}i.remove()}toast('Copied')};

/* ---- keys ---- */
C.loadKeys=async()=>{
  const k='artmark_ck_'+C.me;let j=null;try{j=JSON.parse(localStorage.getItem(k))}catch(e){}
  if(!j){const kp=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveKey']);j={priv:await crypto.subtle.exportKey('jwk',kp.privateKey),pub:await crypto.subtle.exportKey('jwk',kp.publicKey)};try{localStorage.setItem(k,JSON.stringify(j))}catch(e){}}
  C.priv=await crypto.subtle.importKey('jwk',j.priv,{name:'ECDH',namedCurve:'P-256'},false,['deriveKey']);C.pubJwk={kty:j.pub.kty,crv:j.pub.crv,x:j.pub.x,y:j.pub.y};
};
C.publishKey=async()=>{const r=C.cdb.doc('chat_keys/'+C.me),d=await r.get(),o=d.exists?d.data().pub:null;if(!o||o.x!==C.pubJwk.x||o.y!==C.pubJwk.y)await r.set({pub:C.pubJwk,t:Date.now()})};
C.dmKey=async other=>{
  if(C.kc.has(other))return C.kc.get(other);
  const d=await C.cdb.doc('chat_keys/'+other).get();if(!d.exists)throw new Error('nokey');
  const pub=await crypto.subtle.importKey('jwk',d.data().pub,{name:'ECDH',namedCurve:'P-256'},false,[]);
  const k=await crypto.subtle.deriveKey({name:'ECDH',public:pub},C.priv,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  C.kc.set(other,k);return k;
};
C.gkey=async tid=>{
  if(C.gk.has(tid))return C.gk.get(tid);const s=C.gkStore()[tid];if(!s)throw new Error('nogk');
  const k=await crypto.subtle.importKey('raw',b64d(s),'AES-GCM',false,['encrypt','decrypt']);C.gk.set(tid,k);return k;
};
C.tkey=async t=>t.type==='dm'?C.dmKey(C.other(t)):C.gkey(t.id);

/* ---- init ---- */
C.init=async()=>{
  if(C.started)return;C.started=true;
  try{
    if(!window.claude||!window.claude.use){C.status='off';return C.paint()}
    const [cdb,usr]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!cdb||!usr){C.status='off';return C.paint()}
    const id=await usr.id();if(!id){C.status='off';return C.paint()}
    if(!(window.crypto&&crypto.subtle)){C.status='off';C.err='This browser has no secure encryption support.';return C.paint()}
    C.cdb=cdb;C.usr=usr;C.me=id;C.loadPrefs();
    const v=await usr.me();C.pf[id]={id,name:v.name,avatarUrl:v.avatarUrl,color:v.color};
    await C.loadKeys();await C.publishKey();
    C.status='live';C.pxInit();
    C.unsubT=cdb.collection('threads').where('mem_'+id,'==',true).onSnapshot(s=>C.onThreads(s),e=>{C.status='off';C.err=(e&&e.code)||'error';C.paint()});
    try{localStorage.setItem('artmark_chat_on','1')}catch(e){}
    C.paint();C.handlePending();
  }catch(e){C.status='off';C.err=(e&&(e.code||e.message))||'error';C.paint()}
};
C.onThreads=async s=>{
  C.threads=s.docs.map(d=>({id:d.id,...d.data()}));C.pxThreads();
  await C.resolve(C.threads.flatMap(C.mem));
  await Promise.all(C.threads.map(C.decPrev));
  if(C.pendingOpen&&C.thr(C.pendingOpen)){const id=C.pendingOpen;C.pendingOpen=null;C.open(id)}
  C.paint();
};
C.decPrev=async t=>{
  try{
    if(t.type==='group'&&!C.gname[t.id]&&t.nameCt){const n=await decJ(await C.gkey(t.id),t.nameIv,t.nameCt);C.gname[t.id]=n.n}
    if(t.lastCt&&(!C.prev[t.id]||C.prev[t.id].t!==t.lastT)){C.prev[t.id]={t:t.lastT,p:await decJ(await C.tkey(t),t.lastIv,t.lastCt)}}
  }catch(e){}
};
C.previewText=t=>{const p=(C.prev[t.id]||{}).p;if(!p)return t.lastT?'🔒 Message':'No messages yet';
  if(p.type==='sys')return p.ev==='shot'?'⚠️ Screenshot attempt':'ℹ️ '+C.sysText(p);if(p.type==='image')return '📷 Photo';if(p.type==='contact')return '👤 Contact card';if(p.type==='share')return '🖼 Shared art';if(p.type==='del')return '🚫 Deleted';return (t.lastFrom===C.me?'You: ':'')+(p.text||'')};

/* ---- Pusher: online dots and typing (optional; messages never depend on it) ---- */
C.px={client:null,presence:null,chans:{},online:new Set(),typing:{},lastType:0,token:'',off:false,tokSub:0};
C.pxInit=async()=>{
  const cfg=window.ARTMARK_CONFIG||{};
  if(C.px.client||C.px.off||!window.Pusher||!cfg.PUSHER_KEY||!window.SB)return;
  try{
    const {data}=await SB.auth.getSession();C.px.token=(data.session&&data.session.access_token)||'';
    if(!C.px.tokSub){C.px.tokSub=1;SB.auth.onAuthStateChange((ev,s)=>{C.px.token=(s&&s.access_token)||''})}
    const client=new window.Pusher(cfg.PUSHER_KEY,{cluster:cfg.PUSHER_CLUSTER||'us2',channelAuthorization:{endpoint:'/api/pusher-auth',transport:'ajax',headersProvider:()=>({Authorization:'Bearer '+C.px.token})}});
    C.px.client=client;
    const pres=client.subscribe('presence-app');C.px.presence=pres;
    pres.bind('pusher:subscription_succeeded',m=>{C.px.online=new Set();m.each(x=>C.px.online.add(x.id));C.paint()});
    pres.bind('pusher:member_added',x=>{C.px.online.add(x.id);C.paint()});
    pres.bind('pusher:member_removed',x=>{C.px.online.delete(x.id);C.paint()});
    C.pxThreads();
  }catch(e){C.px.off=true}
};
C.pxThreads=()=>{
  if(!C.px.client)return;
  C.threads.forEach(t=>{
    if(C.px.chans[t.id])return;
    const ch=C.px.client.subscribe('private-thread-'+t.id);
    ch.bind('client-typing',d=>{if(!d||d.from===C.me)return;C.px.typing[t.id]=Date.now()+3500;if(C.cur===t.id)C.paintHead();setTimeout(()=>{if(C.cur===t.id)C.paintHead()},3600)});
    C.px.chans[t.id]=ch;
  });
};
C.pxType=()=>{const ch=C.px.chans[C.cur];if(!ch||!ch.subscribed)return;const now=Date.now();if(now-C.px.lastType<2500)return;C.px.lastType=now;try{ch.trigger('client-typing',{from:C.me})}catch(e){}};
C.isTyping=id=>(C.px.typing[id]||0)>Date.now();
C.isOnline=u=>!!u&&C.px.online.has(u);
C.pxReset=()=>{try{C.px.client&&C.px.client.disconnect()}catch(e){}C.px={client:null,presence:null,chans:{},online:new Set(),typing:{},lastType:0,token:'',off:false,tokSub:C.px.tokSub}};

    const lk=C.isLocked(t.id),un=C.unread(t),g=t.type==='group';
    return `<button class="titem ${C.cur===t.id?'on':''}" data-act="copen" data-t="${esc(t.id)}"><span class="avwrap">${lk?'<span class="av" style="--h:220;--s:40px">🔒</span>':C.avatarEl(g?t.id:C.other(t),40,g,C.tName(t))}${!lk&&!g&&C.isOnline(C.other(t))?'<i class="avdot" title="online"></i>':''}</span>
    <span class="tx"><b>${lk?'Locked chat':esc(C.tName(t))}${!lk&&t.shield?' 🛡':''}</b><span class="small muted">${lk?(un?'New message':'Tap to unlock'):esc(C.previewText(t))}</span></span><span class="lmeta"><span class="ltime ${un?'new':''}">${t.lastT?listTime(t.lastT):''}</span>${un?'<span class="bdg">•</span>':''}</span></button>`}).join('')
    :'<p class="pad muted small">No chats yet. Tap <b>New chat</b> to message someone, or <b>Join</b> to enter a group invite code.</p>';
};
C.paintPane=()=>{
  const pane=$('#cpane');if(!pane)return;C.paneKey=C.cur+'|'+(C.cur&&C.isLocked(C.cur));
  if(C.status!=='live'){pane.innerHTML='<p class="pad muted">Connect chat to start messaging.</p>';return}
  const t=C.thr(C.cur);
  if(!t){pane.innerHTML='<div class="empty"><p style="font-size:2rem;margin:0">💬</p><p>Select a chat, start a new one, or join a group with an invite code.</p></div>';return}
  if(C.isLocked(t.id)){pane.innerHTML=`<div class="empty lockscreen"><p style="font-size:2.4rem;margin:0">🔒</p><h3>This chat is locked</h3><form data-form="unlock" data-t="${esc(t.id)}"><input type="password" name="pin" inputmode="numeric" autocomplete="off" placeholder="Enter your chat PIN" maxlength="8" required aria-label="Chat PIN"><button class="btn">Unlock</button></form><p class="err" id="pinerr"></p></div>`;return}
  pane.innerHTML=`<div id="chead" class="chead"></div><div id="msgs" aria-live="polite"></div><div id="replybar" class="replybar" hidden></div>
  <div class="composer"><div id="emo" class="emo" hidden>${EMOJI.map(e=>`<button type="button" data-act="cemoji" data-e="${e}" aria-label="${e}">${e}</button>`).join('')}</div>
  <form data-form="csend"><button type="button" class="ib" data-act="emotoggle" aria-label="Emoji">😊</button><button type="button" class="ib" data-act="cpickimg" aria-label="Send photo" title="Send a photo">📷</button><button type="button" class="ib" data-act="cshareart" aria-label="Share artwork" title="Share my artwork">🖼️</button><button type="button" class="ib" data-act="ccontact" aria-label="Share contact" title="Share my contact">👤</button>
  <input name="text" id="msgin" maxlength="1500" placeholder="Write a message" autocomplete="off" aria-label="Message"><button class="btn">Send</button></form><input type="file" id="cimg" accept="image/*" hidden data-act="cimgpick"></div>`;
  $('#msgin').value=C.draft||'';
  C.paintHead();C.paintMsgs();C.paintReply();
  C.applyShield();
};
C.paintHead=()=>{
  const el=$('#chead'),t=C.thr(C.cur);if(!el||!t)return;const g=t.type==='group',n=C.mem(t).length;
  el.innerHTML=`<button class="iconbtn backbtn" data-act="cback" aria-label="Back to chats">←</button>${C.avatarEl(g?t.id:C.other(t),40,g,C.tName(t))}<div class="grow"><b>${esc(C.tName(t))}</b><div class="small muted">${C.isTyping(t.id)?'<b class="typing">typing…</b>':g?n+' members':(C.isOnline(C.other(t))?'<span class="onl">● online</span>':'Direct chat')} · 🔐 encrypted${t.shield?' · 🛡 screenshot shield':''}${t.ttl?' · ⏱ '+(t.ttl>=86400?Math.round(t.ttl/86400)+' d':Math.round(t.ttl/3600)+' h'):''}</div></div>
  <button class="iconbtn" data-act="clocknow" aria-label="Lock this chat" title="Lock this chat">🔒</button><button class="iconbtn" data-act="cshield" aria-label="Toggle screenshot shield" title="Screenshot shield" style="${t.shield?'background:var(--accent);color:var(--on-accent)':''}">🛡</button><button class="iconbtn" data-act="cmenu" aria-label="Chat settings" title="Chat settings">⋮</button>`;
};
C.visibleMsgs=()=>{
  const clr=C.prefs.cleared[C.cur]||0,hid=C.prefs.hidden[C.cur]||{},now=Date.now();
  return C.msgs.filter(m=>m.t>clr&&!hid[m.id]&&!(m.exp&&m.exp<now));
};
C.sysText=p=>{const w=C.nm(p.who);
  if(p.ev==='shot')return `${w} tried to take a screenshot`;if(p.ev==='join')return `${w} joined`;if(p.ev==='left')return `${w} left`;
  if(p.ev==='removed')return `${C.nm(p.who)} was removed by ${C.nm(p.by)}`;
  if(p.ev==='shield')return `${w} turned the screenshot shield ${p.on?'on':'off'}`;
  if(p.ev==='ttl')return p.sec?`${w} set disappearing messages to ${p.sec>=86400?Math.round(p.sec/86400)+' day(s)':Math.round(p.sec/3600)+' hour(s)'}`:`${w} turned off disappearing messages`;
  if(p.ev==='created')return `${w} created the group`;return 'Chat update'};
C.bubble=(m,t,fresh)=>{
  const p=m.plain||{},mine=m.from===C.me;
  if(p.type==='sys')return `<div class="sysmsg ${p.ev==='shot'?'alert':''}">${p.ev==='shot'?'⚠️ ':''}${esc(C.sysText(p))}</div>`;
  const others=C.mem(t).filter(x=>x!==C.me),readBy=others.filter(o=>((t.reads||{})[o]||0)>=m.t).length;
  const tick=mine?`<span class="tick" title="${readBy===others.length&&others.length?'Seen':'Sent'}">${readBy===others.length&&others.length?'✓✓':'✓'}</span>`:'';
  const nameLine=(!mine&&t.type==='group')?`<div class="small" style="font-weight:700;color:var(--accent)">${esc(C.nm(m.from))}</div>`:'';
  if(m.del||p.type==='del')return `<div class="msg gone ${mine?'me':''}">${nameLine}🚫 This message was deleted<div class="tm" title="${esc(fmtDateTime(m.t))}">${tm(m.t)}</div></div>`;
  let body='';
  if(p.reply)body+=`<div class="quote"><b>${esc(C.nm(p.reply.from))}</b><br>${esc(p.reply.text||'')}</div>`;
  if(p.type==='image')body+=`<img class="cimg" src="${esc(p.img)}" alt="Photo">${p.text?`<div>${linkify(p.text)}</div>`:''}`;
  else if(p.type==='contact'){const c=p.card||{},wa=waLink(c.phone);body+=`<div class="xcard"><div>${avatar({name:c.name||'?'},40)}</div><div style="min-width:0"><b>${esc(c.name)}</b>${c.email?`<br><span class="small">✉️ <a href="mailto:${esc(c.email)}">${esc(c.email)}</a></span>`:''}${c.phone?`<br><span class="small">📱 ${esc(c.phone)} ${wa?`· <a href="${wa}" target="_blank" rel="noopener noreferrer">WhatsApp</a>`:''}</span>`:''}${!mine?`<br><button class="btn sm" style="margin-top:6px" data-act="csavecard" data-m="${esc(m.id)}">Save to contacts</button>`:''}</div></div>`}
  else if(p.type==='share'){const s=p.share||{};body+=`<div class="xcard">${s.thumb?`<img src="${esc(s.thumb)}" alt="">`:''}<div style="min-width:0"><b>${esc(s.title)}</b><br><span class="small muted">Shared ${s.k==='listing'?'listing':'artwork'}</span></div></div>`}
  else body+=`<div>${linkify(p.text||'')}</div>`;
  const rx={};Object.values(m.reactions||{}).forEach(e=>{if(e)rx[e]=(rx[e]||0)+1});
  const rxh=Object.keys(rx).length?`<div class="rx">${Object.entries(rx).map(([e,n])=>`<span>${e}${n>1?' '+n:''}</span>`).join('')}</div>`:'';
  const canCopy=!t.shield&&['text',undefined].includes(p.type);
  return `<div class="msg ${mine?'me':''} ${fresh?'fresh':''}" data-mid="${esc(m.id)}"><button class="mm" data-act="msgmenu" aria-label="Message options">⋯</button>${nameLine}${body}${rxh}<div class="tm" title="${esc(fmtDateTime(m.t))}">${tm(m.t)} ${tick}</div>
  <div class="mact"><span class="rxpick">${['👍','❤️','😂','😮','😢','🙏'].map(e=>`<button data-act="creact" data-m="${esc(m.id)}" data-e="${e}">${e}</button>`).join('')}</span>
  <button data-act="creply" data-m="${esc(m.id)}">Reply</button>${canCopy?`<button data-act="ccopymsg" data-m="${esc(m.id)}">Copy</button>`:''}<button data-act="cdelme" data-m="${esc(m.id)}">Delete for me</button>${mine?`<button data-act="cdelall" data-m="${esc(m.id)}">Delete for everyone</button>`:''}</div></div>`;
};
C.paintMsgs=()=>{
  const el=$('#msgs'),t=C.thr(C.cur);if(!el||!t||C.isLocked(t.id))return;
  const near=el.scrollHeight-el.scrollTop-el.clientHeight<120||!el.dataset.init;
  let last='';const vm=C.visibleMsgs();C.seen=C.seen&&C.seenFor===C.cur?C.seen:new Set();const first=C.seenFor!==C.cur;C.seenFor=C.cur;
  el.innerHTML=vm.map(m=>{const d=dayLabel(m.t),h=d!==last?`<div class="day">${d}</div>`:'';last=d;const fr=!first&&!C.seen.has(m.id);C.seen.add(m.id);return h+C.bubble(m,t,fr)}).join('')||'<p class="muted small" style="margin:auto;text-align:center">No messages yet. Say hello 👋</p>';
  if(near){el.scrollTop=el.scrollHeight;el.dataset.init=1}
  C.applyShield();
};
C.paintReply=()=>{const el=$('#replybar');if(!el)return;if(!C.reply){el.hidden=true;el.innerHTML='';return}el.hidden=false;el.innerHTML=`<span class="small"><b>Replying to ${esc(C.nm(C.reply.from))}</b><br>${esc(C.reply.text)}</span><button class="iconbtn" data-act="creplyx" aria-label="Cancel reply">×</button>`};

/* ---- open / lock ---- */
C.open=id=>{
  C.cur=id;C.reply=null;C.draft='';C.unsubM&&C.unsubM();C.unsubM=null;C.mc.clear();C.msgs=[];
  delete C.prefs.gone[id];C.savePrefs();
  const t=C.thr(id);
  if(t&&!C.isLocked(id))C.subMsgs(id);
  C.paneKey=null;C.paint();
  const root=$('#cchat');if(root)root.classList.add('opened');
};
C.subMsgs=tid=>{
  const my=++C.seq;
  C.unsubM=C.cdb.collection(`threads/${tid}/msgs`).orderBy('t','desc').limit(200).onSnapshot(async s=>{
    const t=C.thr(tid);if(!t)return;let key=null;try{key=await C.tkey(t)}catch(e){C.keyErr=e.message}
    const rows=[];
    for(const d of s.docs){
      const v=d.data(),sig=(v.ct||'')+(v.del?'d':'');let m=C.mc.get(d.id);
      if(!m||m.sig!==sig){m={sig,plain:null};
        if(v.del)m.plain={type:'del'};
        else if(!key)m.plain={type:'text',text:'🔒 Cannot decrypt here. '+(C.keyErr==='nogk'?'Join this group again with its invite code on this device.':C.keyErr==='nokey'?'The other person has not set up chat yet.':'Your encryption key on this device is different.'),err:1};
        else try{m.plain=await decJ(key,v.iv,v.ct)}catch(e){m.plain={type:'text',text:'🔒 Cannot decrypt this message on this device',err:1}}
        C.mc.set(d.id,m)}
      rows.push({...v,id:d.id,plain:m.plain,reactions:v.reactions||{}});
    }
    if(my!==C.seq||C.cur!==tid)return;
    C.msgs=rows.reverse();C.paintMsgs();C.markRead();C.expireOwn();
  },e=>{C.err=(e&&e.code)||'error';toast('Chat connection problem: '+C.err)});
};
C.markRead=()=>{
  const t=C.thr(C.cur);if(!t||document.hidden||route().page!=='chat')return;
  const inc=C.msgs.filter(m=>m.from!==C.me&&m.plain&&m.plain.type!=='sys');if(!inc.length)return;
  const lt=inc[inc.length-1].t;if(((t.reads||{})[C.me]||0)>=lt)return;
  clearTimeout(C.readT);C.readT=setTimeout(()=>{C.cdb.doc('threads/'+t.id).update({reads:{[C.me]:lt}}).catch(()=>{})},700);
};
C.expireOwn=()=>{let n=0;const now=Date.now();C.msgs.forEach(m=>{if(m.from===C.me&&m.exp&&m.exp<now&&n++<5)C.cdb.doc(`threads/${C.cur}/msgs/${m.id}`).delete().catch(()=>{})})};
C.relock=()=>{
  if(!C.unlocked.size)return;C.unlocked.clear();
  if(C.cur&&C.prefs.locked[C.cur]){C.unsubM&&C.unsubM();C.unsubM=null;C.msgs=[];C.mc.clear();C.reply=null;C.draft=''}
  C.paneKey=null;C.paint();
};
C.bumpIdle=()=>{clearTimeout(C.idleT);if(C.unlocked.size)C.idleT=setTimeout(()=>C.relock(),180000)};
C.tryUnlock=async(tid,pin)=>{
  if(Date.now()<C.lockedUntil)return 'Too many tries. Wait a little and try again.';
  const d=C.pinData();if(!d)return 'No PIN is set.';
  if(await pinHash(pin,d.salt)!==d.hash){if(++C.fails>=5){C.lockedUntil=Date.now()+30000;C.fails=0}return 'Wrong PIN.'}
  C.fails=0;C.unlocked.add(tid);C.bumpIdle();C.open(tid);return '';
};

/* ---- sending ---- */
C.sendTo=(tid,plain)=>{
  C.q=C.q.then(async()=>{
    const t=C.thr(tid);if(!t)throw new Error('thread');
    let key;try{key=await C.tkey(t)}catch(e){toast(e.message==='nokey'?'They have not opened Artmark Chat yet, so a secure chat cannot start.':'No encryption key for this chat on this device.');return}
    const e=await encJ(key,plain),now=Date.now(),doc={from:C.me,t:now,iv:e.iv,ct:e.ct};if(t.ttl)doc.exp=now+t.ttl*1000;
    await C.cdb.doc(`threads/${tid}/msgs/${rid(10)}`).set(doc);
    const pv={type:plain.type,text:(plain.text||'').slice(0,60),ev:plain.ev,who:plain.who,by:plain.by,on:plain.on,sec:plain.sec},pe=await encJ(key,pv);
    await C.cdb.doc('threads/'+tid).update({lastT:now,lastFrom:C.me,lastIv:pe.iv,lastCt:pe.ct});
  }).catch(e=>{toast('Could not send: '+((e&&(e.code||e.message))||'error'))});
  return C.q;
};
C.send=async text=>{
  const p={type:'text',text};if(C.reply){p.reply={id:C.reply.id,from:C.reply.from,text:C.reply.text.slice(0,80)};C.reply=null;C.paintReply()}
  await C.sendTo(C.cur,p);
};
C.sys=(tid,o)=>C.sendTo(tid,{type:'sys',...o});

/* ---- start chats ---- */
C.dm=async other=>{
  if(!other||other===C.me)return toast('Pick another person.');
  if(C.status!=='live')return toast('Chat is not connected in this view.');
  const tid='d_'+[C.me,other].sort().join('_'),ref=C.cdb.doc('threads/'+tid);
  try{
    const kd=await C.cdb.doc('chat_keys/'+other).get();
    if(!kd.exists)return modal(`<h2>They are not on chat yet</h2><p>This person has not opened Artmark Chat yet, so a secure chat cannot start. Send them your chat ID or the page link, and try again once they have opened Chat.</p><button class="btn" data-act="copytxt" data-v="${esc(C.me)}">Copy my chat ID</button>`);
    const d=await ref.get();
    if(!d.exists)await ref.set({type:'dm',['mem_'+C.me]:true,['mem_'+other]:true,created:Date.now(),shield:false,ttl:0});
    await C.resolve([other]);
    delete C.prefs.gone[tid];C.savePrefs();C.pendingOpen=tid;closeModalQuiet();
    if(route().page!=='chat')location.hash='#/chat';
    if(C.thr(tid)){C.pendingOpen=null;C.open(tid)}
  }catch(e){toast('Could not start the chat: '+((e&&(e.code||e.message))||'error'))}
};
C.createGroup=async name=>{
  const tid='g_'+rid(8),raw=crypto.getRandomValues(new Uint8Array(32));C.saveGk(tid,raw);
  const nm=await encJ(await C.gkey(tid),{n:name});
  await C.cdb.doc('threads/'+tid).set({type:'group',['mem_'+C.me]:true,owner:C.me,created:Date.now(),max:50,nameIv:nm.iv,nameCt:nm.ct,shield:false,ttl:0});
  C.gname[tid]=name;C.pendingOpen=tid;
  setTimeout(()=>{C.sys(tid,{ev:'created',who:C.me})},400);
  return tid;
};
C.inviteCode=tid=>{const s=C.gkStore()[tid];return s?tid+'.'+s:''};
C.joinGroup=async code=>{
  code=String(code||'').trim().replace(/^.*#\/join\//,'');const [gid,k]=code.split('.');
  if(!gid||!k||!gid.startsWith('g_'))return toast('That invite code looks wrong.');
  try{
    const d=await C.cdb.doc('threads/'+gid).get();if(!d.exists||d.data().type!=='group')return toast('Group not found. Check the code.');
    const t=d.data(),key=await crypto.subtle.importKey('raw',b64d(k),'AES-GCM',false,['encrypt','decrypt']);
    let nm;try{nm=await decJ(key,t.nameIv,t.nameCt)}catch(e){return toast('That invite code is not valid for this group.')}
    const already=t['mem_'+C.me]===true,members=C.mem(t);
    if(!already&&members.length>=(t.max||50))return toast('This group is full.');
    C.saveGk(gid,b64d(k));C.gname[gid]=nm.n;
    if(!already)await C.cdb.doc('threads/'+gid).update({['mem_'+C.me]:true});
    delete C.prefs.gone[gid];C.savePrefs();C.pendingOpen=gid;closeModalQuiet();
    if(route().page!=='chat')location.hash='#/chat';
    if(!already)setTimeout(()=>C.sys(gid,{ev:'join',who:C.me}),500);
    toast(already?'You are already in this group':'Joined '+nm.n);
  }catch(e){toast('Could not join: '+((e&&(e.code||e.message))||'error'))}
};

/* ---- shield (best-effort screenshot deterrent) ---- */
C.shieldOn=()=>{const t=C.thr(C.cur);return !!(t&&t.shield&&C.status==='live'&&route().page==='chat'&&!C.isLocked(t.id))};
C.applyShield=()=>{
  const pane=$('#cpane'),ms=$('#msgs');if(!pane)return;const on=C.shieldOn();
  pane.classList.toggle('shielded',on);
  const hide=on&&(Date.now()<C.blurUntil||document.hidden||!C.focused);
  pane.classList.toggle('blurred',hide);
  if(ms){if(on){const nm=esc((C.pf[C.me]&&C.pf[C.me].name)||'Artmark');ms.style.backgroundImage=`url("data:image/svg+xml;utf8,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='240' height='140'><text x='20' y='90' transform='rotate(-24 120 70)' font-family='sans-serif' font-size='16' fill='%23888' fill-opacity='0.16'>${nm} · Artmark</text></svg>`)}")`}else ms.style.backgroundImage=''}
};
C.isShot=e=>{const k=(e.key||'').toLowerCase();return e.key==='PrintScreen'||e.code==='PrintScreen'||((e.metaKey||e.ctrlKey)&&e.shiftKey&&k==='s')||(e.metaKey&&e.shiftKey&&['Digit3','Digit4','Digit5'].includes(e.code))||((e.ctrlKey||e.metaKey)&&(k==='p'||k==='s'))};
C.shot=e=>{
  if(['p','s'].includes((e.key||'').toLowerCase())&&!e.shiftKey)e.preventDefault();
  C.blurUntil=Date.now()+4000;C.applyShield();setTimeout(C.applyShield,4100);
  try{navigator.clipboard&&navigator.clipboard.writeText(' ')}catch(x){}
  if(Date.now()-C.lastShot>10000){C.lastShot=Date.now();C.sys(C.cur,{ev:'shot',who:C.me});toast('Screenshot attempt detected. Everyone in this chat was notified.')}
};
window.addEventListener('keydown',e=>{if(C.shieldOn()&&C.isShot(e))C.shot(e)});
window.addEventListener('keyup',e=>{if(C.shieldOn()&&(e.key==='PrintScreen'||e.code==='PrintScreen'))C.shot(e)});
window.addEventListener('blur',()=>{C.focused=false;C.applyShield()});
window.addEventListener('focus',()=>{C.focused=true;C.applyShield()});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){C.hiddenAt=Date.now()}else if(C.hiddenAt&&Date.now()-C.hiddenAt>20000)C.relock();
  C.applyShield();
});
window.addEventListener('beforeprint',()=>{if(C.shieldOn())C.shot({key:'p'})});
document.addEventListener('copy',e=>{if(!C.shieldOn())return;const n=getSelection().anchorNode;if(n&&$('#cpane')&&$('#cpane').contains(n))e.preventDefault()});
document.addEventListener('contextmenu',e=>{if(C.shieldOn()&&e.target.closest&&e.target.closest('#msgs'))e.preventDefault()});
document.addEventListener('dragstart',e=>{if(C.shieldOn()&&e.target.closest&&e.target.closest('#msgs'))e.preventDefault()});
['click','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>C.bumpIdle(),{passive:true}));


/* ---- settings helpers ---- */
C.react=async(mid,e)=>{const m=C.msgs.find(x=>x.id===mid);if(!m)return;const cur=(m.reactions||{})[C.me];
  try{await C.cdb.doc(`threads/${C.cur}/msgs/${mid}`).update({reactions:{[C.me]:cur===e?'':e}})}catch(x){toast('Could not react')}};
C.setShield=async on=>{const t=C.thr(C.cur);if(!t)return;
  try{await C.cdb.doc('threads/'+t.id).update({shield:!!on});C.sys(t.id,{ev:'shield',on:!!on,who:C.me})}catch(e){toast('Could not change the shield')}};
C.setTtl=async sec=>{const t=C.thr(C.cur);if(!t)return;
  try{await C.cdb.doc('threads/'+t.id).update({ttl:sec});C.sys(t.id,{ev:'ttl',sec,who:C.me})}catch(e){toast('Could not change the timer')}};
C.lockThread=id=>{
  if(!id)return;
  if(!C.pinData()){modal(`<h2>Set a chat PIN first</h2><p class="muted small">Choose a 4 to 8 digit PIN. You will use it to open locked chats on this device.</p><form data-form="pinset" data-after="${esc(id)}"><label class="f">PIN<input type="password" name="pin" inputmode="numeric" pattern="[0-9]{4,8}" required maxlength="8" autocomplete="off"></label><label class="f">Repeat PIN<input type="password" name="pin2" inputmode="numeric" pattern="[0-9]{4,8}" required maxlength="8" autocomplete="off"></label><p class="err" id="pinerr2"></p><button class="btn" style="width:100%">Save PIN and lock</button></form>`);return}
  C.prefs.locked[id]=1;C.savePrefs();C.unlocked.delete(id);
  C.unsubM&&C.unsubM();C.unsubM=null;C.msgs=[];C.mc.clear();C.reply=null;C.draft='';C.paneKey=null;closeModalQuiet();C.paint();toast('Chat locked');
};

/* ================= AI CRITIC ================= */
const AI={msgs:[],img:null,busy:false,ctx:{title:'',medium:'',size:'',hours:'',level:'intermediate',cur:'',kind:'Original'},seeded:false};
const CURS=[['USD','US dollar'],['PKR','Pakistani rupee'],['EUR','Euro'],['GBP','British pound'],['INR','Indian rupee'],['AED','UAE dirham'],['CAD','Canadian dollar'],['AUD','Australian dollar']];
const MEDIUMS=['Auto-detect','Pencil / graphite sketch','Ink or pen','Charcoal','Oil painting','Acrylic painting','Watercolour','Digital art','Mixed media'];
const LEVELS=[['beginner','Beginner'],['intermediate','Intermediate'],['advanced','Advanced or professional']];
const AI_JSON=`{"isArtwork":true,"medium":"short guess of the medium","overall":0.0,"verdict":"one honest sentence","scores":{"composition":0,"colour_and_value":0,"technique":0,"originality":0,"presentation":0},"strengths":["..."],"improvements":["..."],"next_steps":["a concrete practice exercise"],"price":{"currency":"USD","low":0,"high":0,"reasoning":["..."],"raises":["..."],"confidence":"low"},"tags":["..."],"notes":"caveats or empty"}`;
function curFmt(n,c){try{return new Intl.NumberFormat(undefined,{style:'currency',currency:c,maximumFractionDigits:0}).format(n)}catch(e){return c+' '+Math.round(n)}}
function defCur(){const m=me(),c=(m&&m.country)||'';return {Pakistan:'PKR',India:'INR',UAE:'AED','United Kingdom':'GBP',France:'EUR',Germany:'EUR',Italy:'EUR',Canada:'CAD',Australia:'AUD'}[c]||'USD'}
function parseJsonLoose(t){
  t=String(t||'').trim();try{return JSON.parse(t)}catch(e){}
  const f=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(f){try{return JSON.parse(f[1])}catch(e){}}
  const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch(e){}}
  throw {code:'invalid_json'};
}
function dataToBlob(url){const [h,b]=url.split(',');const mime=(h.match(/data:(.*?);/)||[])[1]||'image/jpeg';const a=atob(b),u=new Uint8Array(a.length);for(let i=0;i<a.length;i++)u[i]=a.charCodeAt(i);return new Blob([u],{type:mime})}
const clamp=(n,a,b)=>Math.min(b,Math.max(a,Number.isFinite(+n)?+n:a));
const strs=(x,n)=>(Array.isArray(x)?x:[]).map(v=>String(v).slice(0,300)).filter(Boolean).slice(0,n);

AI.rules=c=>`You are a warm, honest, experienced art mentor reviewing a photo of an artwork shared on an art community site. Be specific to what you can actually see. Do not flatter: on this scale 5 is a solid hobbyist piece, 7 is strong, 9 or more is exceptional and rare. Mention real strengths first, then the most useful improvements. Never identify real people in a photo.
If the photo is not an artwork, or is too blurry or dark to judge, set "isArtwork" to false, explain in "verdict", and leave numbers at 0.
PRICE: suggest a realistic price RANGE in ${c.cur} for selling this piece as ${c.kind==='Print'?'a print':'an original'}, based on its size, medium, apparent skill, time spent and typical prices for emerging artists. Give 2 to 4 short reasons, 2 or 3 things that would raise the price, and a confidence of "low", "medium" or "high". Real prices depend on audience, reputation and sales history, so never promise a sale; say so in "notes".
Artist's details: title "${c.title||'untitled'}"; medium ${c.medium&&c.medium!=='Auto-detect'?c.medium:'not stated, detect it'}; size ${c.size||'not stated'}; time spent ${c.hours?c.hours+' hours':'not stated'}; self-described level ${c.level}.
Reply with ONLY one JSON object in exactly this shape (numbers: overall is 0 to 10 with one decimal, each score is 0 to 10, prices are whole numbers): ${AI_JSON}`;
AI.chatRules=r=>`You are a warm, honest art mentor chatting with an artist about their artwork. Earlier you reviewed their photo. The photo is not attached now, so rely on this summary of your review: ${JSON.stringify(r)}. Answer follow-up questions in under 150 words, with concrete, practical advice. If asked about price, stay consistent with the range you gave and remind them it is an estimate. Plain text, no markdown headings.`;
AI.normalize=j=>{
  const s=j&&j.scores||{},p=j&&j.price||{},cur=String(p.currency||AI.ctx.cur||'USD').slice(0,3).toUpperCase();
  let lo=Math.max(0,Math.round(+p.low||0)),hi=Math.max(0,Math.round(+p.high||0));if(lo>hi)[lo,hi]=[hi,lo];
  return {isArtwork:j&&j.isArtwork!==false,medium:String(j&&j.medium||'').slice(0,60),overall:Math.round(clamp(j&&j.overall,0,10)*10)/10,verdict:String(j&&j.verdict||'').slice(0,300),
    scores:{composition:clamp(s.composition,0,10),colour_and_value:clamp(s.colour_and_value,0,10),technique:clamp(s.technique,0,10),originality:clamp(s.originality,0,10),presentation:clamp(s.presentation,0,10)},
    strengths:strs(j&&j.strengths,5),improvements:strs(j&&j.improvements,6),next_steps:strs(j&&j.next_steps,4),tags:strs(j&&j.tags,6),notes:String(j&&j.notes||'').slice(0,400),
    price:{currency:cur,low:lo,high:hi,reasoning:strs(p.reasoning,4),raises:strs(p.raises,4),confidence:['low','medium','high'].includes(p.confidence)?p.confidence:'low'}};
};
AI.call=async({turns,blob,dataUrl,json,onText})=>{
  const sample=(window.claude&&window.claude.use)?await window.claude.use('sample'):null;
  if(sample){
    const opts={cache:false};
    if(blob){const lim=await sample.limits().catch(()=>null);if(!lim||!lim.images)throw {code:'images_unavailable'};opts.images=blob}
    if(json)return {json:await sample.json(turns,opts)};
    if(onText)opts.onText=onText;
    return {text:(await sample(turns,opts)).text};
  }
  if(window.SB){
    const {data}=await SB.auth.getSession(),tok=data.session&&data.session.access_token;if(!tok)throw {code:'not_signed_in'};
    const res=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:JSON.stringify({turns,image:dataUrl||null})});
    const body=await res.json().catch(()=>({}));if(!res.ok)throw {code:body.code||('http_'+res.status),message:body.error};
    return json?{json:parseJsonLoose(body.text)}:{text:body.text};
  }
  throw {code:'ai_unavailable'};
};
AI.errText=e=>{const c=e&&e.code;return {not_granted:'AI feedback needs your permission to run. Tap the button again and allow it.',rate_limited:'Too many requests right now. Wait a minute and try again.',images_unavailable:'This view cannot send photos to the AI.',invalid_json:'The AI answer came back garbled. Please try again.',not_signed_in:'Log in first to use the AI critic.',ai_unavailable:'The AI critic is not available in this view. Open the published Artmark page, or connect the AI server (see the README).',http_401:'Please log in again.',http_429:'You have used the AI critic a lot this hour. Try again later.'}[c]||('The AI critic could not answer ('+(c||(e&&e.message)||'error')+'). Please try again.')};
AI.readCtx=()=>{const f=$('#aiform');if(f){const g=n=>f.elements[n]?f.elements[n].value.trim():'';Object.assign(AI.ctx,{title:g('title'),medium:g('medium'),size:g('size'),hours:g('hours'),level:g('level')||'intermediate',cur:g('cur')||AI.ctx.cur,kind:g('kind')||'Original'})}if(!AI.ctx.cur)AI.ctx.cur=defCur();return AI.ctx};
AI.setImage=async file=>{
  const url=URL.createObjectURL(file);
  try{const dataUrl=await dataImg(url,1024,.82);AI.img={dataUrl,blob:dataToBlob(dataUrl)};AI.paintPreview()}
  catch(e){toast('Could not read that image')}finally{URL.revokeObjectURL(url)}
};
AI.run=async()=>{
  if(AI.busy)return;if(!AI.img)return toast('Add a photo of your artwork first');
  const c=AI.readCtx();AI.busy=true;
  AI.msgs.push({role:'user',img:AI.img.dataUrl,text:`Please review my artwork${c.title?` "${c.title}"`:''}.`,t:Date.now()});AI.msgs.push({role:'ai',typing:true});AI.paint();
  try{
    const out=await AI.call({turns:[{role:'user',content:AI.rules(c)}],blob:AI.img.blob,dataUrl:AI.img.dataUrl,json:true});
    const r=AI.normalize(out.json);AI.msgs.pop();AI.msgs.push({role:'ai',review:r,ctx:{...c},img:AI.img.dataUrl,t:Date.now()});
    AI.review=r;
    if(r.isArtwork){db.ai=db.ai||[];db.ai.unshift({id:uid('r'),t:Date.now(),title:c.title||'Untitled',overall:r.overall,price:r.price,verdict:r.verdict});db.ai=db.ai.slice(0,30);save()}
  }catch(e){AI.msgs.pop();AI.msgs.push({role:'ai',err:AI.errText(e),t:Date.now()})}
  AI.busy=false;AI.paint();AI.paintSide();
};
AI.ask=async text=>{
  if(AI.busy||!text)return;
  const last=[...AI.msgs].reverse().find(m=>m.review);if(!last){toast('Share a photo first so I can review it');return}
  AI.busy=true;AI.msgs.push({role:'user',text,t:Date.now()});const bub={role:'ai',text:'',typing:true,t:Date.now()};AI.msgs.push(bub);AI.paint();
  const r=last.review,sum={score:r.overall,verdict:r.verdict,strengths:r.strengths,improvements:r.improvements,price:r.price,context:last.ctx};
  const turns=[{role:'user',content:AI.chatRules(sum)},{role:'assistant',content:'Understood. Ask me anything about this artwork.'}];
  AI.msgs.filter(m=>!m.review&&!m.err&&(m.text||'').length&&m!==bub&&!m.img).slice(-8).forEach(m=>turns.push({role:m.role==='ai'?'assistant':'user',content:m.text}));
  // make sure the sequence alternates and ends on the user's question
  const clean=[turns[0],turns[1]];for(const t of turns.slice(2)){if(t.role!==clean[clean.length-1].role)clean.push(t);else clean[clean.length-1]={role:t.role,content:clean[clean.length-1].content+'\n'+t.content}}
  if(clean[clean.length-1].role!=='user')clean.push({role:'user',content:text});
  try{const out=await AI.call({turns:clean,json:false,onText:u=>{bub.text=u.text;bub.typing=false;AI.paint()}});bub.text=out.text;bub.typing=false}
  catch(e){bub.typing=false;bub.err=AI.errText(e);bub.text=''}
  AI.busy=false;AI.paint();
};
AI.summaryText=(r,ctx)=>`AI review${ctx&&ctx.title?` of "${ctx.title}"`:''}: ${r.overall}/10. ${r.verdict}\nStrengths: ${r.strengths.join('; ')}\nImprove: ${r.improvements.join('; ')}\nSuggested price: ${curFmt(r.price.low,r.price.currency)} to ${curFmt(r.price.high,r.price.currency)} (${r.price.confidence} confidence, estimate only).`;

function scoreRing(v){const c=2*Math.PI*34,off=c*(1-v/10);return `<svg class="ring" viewBox="0 0 80 80" role="img" aria-label="Overall mark ${v} out of 10"><circle cx="40" cy="40" r="34" fill="none" stroke="var(--line)" stroke-width="7"/><circle cx="40" cy="40" r="34" fill="none" stroke="var(--gold)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 40 40)"/><text x="40" y="45" text-anchor="middle" font-family="var(--display)" font-size="20" font-weight="800" fill="currentColor">${v}</text></svg>`}

  <div class="two cols"><div><h4>What works</h4><ul>${r.strengths.map(x=>`<li>${esc(x)}</li>`).join('')||'<li class="muted">Nothing noted.</li>'}</ul></div><div><h4>Improve next</h4><ul>${r.improvements.map(x=>`<li>${esc(x)}</li>`).join('')||'<li class="muted">Nothing noted.</li>'}</ul></div></div>

}
AI.paint=()=>{

const SBA={
  async signup(f){

function pageStatus(){

async function runStatus(){
  const el=$('#statuslist');if(!el)return;el.textContent='Checking…';
  const rows=[],add=(st,label,hint)=>rows.push({st,label,hint:st==='ok'?'':(hint||'')});
  const J=async u=>{try{const r=await fetch(u,{cache:'no-store'});const t=await r.text();let j=null;try{j=JSON.parse(t)}catch(e){}return {ok:r.ok,status:r.status,j}}catch(e){return {ok:false,status:0,j:null}}};
  add('ok','Website files loaded');
  const cfg=await J('/api/config');
  if(cfg.status===0||cfg.status===404)add('bad','Server files (api folder) are running','The api folder is not deployed. On GitHub the folder named api (with ai.js, config.js, health.js, pusher-auth.js inside) must be at the top level of the repository. Add it, then wait for Vercel to redeploy.');
  else if(!cfg.ok)add('bad','Server settings page (/api/config)','It returned an error'+(cfg.j&&cfg.j.error?': '+cfg.j.error:'')+'. Fix the variable it names in Vercel, then Redeploy.');
  else{
    add('ok','Server files (api folder) are running');
    const c=cfg.j||{};
    add(/^https:\/\/[^\s]+\.[a-z]{2,}\/?$/i.test(c.SUPABASE_URL||'')?'ok':'bad','Supabase address (SUPABASE_URL)',(c.SUPABASE_URL||'')?'It must look like https://xxxx.supabase.co. Edit the variable in Vercel and Redeploy.':'Not set in Vercel. Add SUPABASE_URL and Redeploy.');
    add(c.SUPABASE_ANON_KEY?'ok':'bad','Supabase public key (SUPABASE_ANON_KEY)',c.SUPABASE_ANON_KEY?'':'Not set in Vercel. Use the publishable / anon key, never the secret key.');
    add(c.PUSHER_KEY?'ok':'warn','Pusher key (PUSHER_KEY)',c.PUSHER_KEY?'':'Not set. Online dots and typing will be off, but chat still works.');
  }
  add(window.SB?'ok':'bad','Supabase connected in this page',window.SB?'':'Press Ctrl+F5. If it is still red, the settings above show what is missing.');
  let session=null;
  if(window.SB){try{const g=await SB.auth.getSession();session=g.data.session}catch(e){}}
  add(session?'ok':'warn','Logged in with a real account',session?'':'Not logged in. Sign up or log in, then run the check again.');
  if(window.SB&&session){
    try{const r=await SB.from('docs').select('path').limit(1);add(r.error?'bad':'ok','Database tables ready (docs)',r.error?'Run supabase.sql in Supabase > SQL Editor. Message: '+(r.error.message||r.error.code):'')}catch(e){add('bad','Database tables ready (docs)','Could not reach Supabase.')}
    try{const r=await SB.from('profiles').select('id').limit(1);add(r.error?'bad':'ok','Profiles table ready',r.error?'Run supabase.sql again.':'')}catch(e){}
  }
  const h=await J('/api/health');
  if(h.ok&&h.j){
    add(h.j.supabase_configured?'ok':'bad','Server can see the Supabase variables',h.j.supabase_configured?'':'The server cannot see SUPABASE_URL / SUPABASE_ANON_KEY. Check names and the Production box in Vercel.');
    add(h.j.pusher_configured?'ok':'warn','Server can see PUSHER_KEY and PUSHER_SECRET',h.j.pusher_configured?'':'Add PUSHER_SECRET (type Secret) in Vercel for online dots and typing.');
    const prov=h.j.ai_provider;
    add(h.j.ai_configured?(prov?'ok':'warn'):'bad','AI critic key on the server'+(prov?' ('+prov+')':''),h.j.ai_configured?'Old server files are live. Upload the 4 new api files so the AI can be identified.':(prov?'Add GEMINI_API_KEY or ANTHROPIC_API_KEY in Vercel and Redeploy.':'The server reports no AI key. The old server files only know ANTHROPIC_API_KEY, so a Gemini key is not seen. Upload the 4 new api files (they support Gemini), or add ANTHROPIC_API_KEY.'));
  }else add('warn','Server health page (/api/health)','Could not open it.');
  if(C.px&&C.px.client){const st=C.px.client.connection&&C.px.client.connection.state;add(st==='connected'?'ok':'warn','Pusher connection','State: '+(st||'unknown')+(st==='connected'?'':'. Check that the key and secret come from the same Pusher app and that Enable client events is on.'))}
  add(C.status==='live'?'ok':(session?'bad':'warn'),'Live chat connected',C.status==='live'?'':(session?'Open the Chat page once. If it still fails, read the lines above for the first red item.':'Log in first.'));
  const ico={ok:'✅',bad:'❌',warn:'⚠️'};
  el.innerHTML=rows.map(r=>`<div class="strow"><span class="stic">${ico[r.st]}</span><div><b>${esc(r.label)}</b>${r.hint?`<div class="sthint">${esc(r.hint)}</div>`:''}</div></div>`).join('');
}

/* ---------- video autoplay ---------- */
let io=null;
function hookVideos(){
  if(!('IntersectionObserver' in window))return;
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target;if(e.isIntersecting){v.play().catch(()=>{})}else v.pause()}),{threshold:.6});
  document.querySelectorAll('video[data-auto]').forEach(v=>io.observe(v));
}

    const d=new FormData(f),email=d.get('email').trim().toLowerCase();
    if(window.SB){
      const {error}=await SB.auth.resetPasswordForEmail(email,{redirectTo:baseUrl()});

    }
    const u=db.users.find(x=>x.email===email&&!x.seed);
    if(!u||u.country!==d.get('country'))return setErr('autherr','We could not match those details.');
    u.hash=await hash(email,d.get('pw'));save();
    modal(`<h2>Password updated</h2><p>You can now log in with your new password.</p><button class="btn" data-act="authtab" data-t="login">Go to log in</button>`);

    const d=new FormData(f),m=me(),n=d.get('pw'),n2=d.get('pw2');if(!m)return;

    if(m.hash!==await hash(m.email,d.get('cur')))return setErr('autherr','Your current password is not correct.');
    m.hash=await hash(m.email,n);save();closeModal();toast('Password changed ✓');
  },
  async newpw(f){
    const d=new FormData(f),n=d.get('pw'),n2=d.get('pw2');
    if(n!==n2)return setErr('autherr','The two passwords do not match.');
    const {error}=await SB.auth.updateUser({password:n});if(error)return setErr('autherr',error.message);
    closeModal();toast('New password saved. You are logged in ✓');
  },

    if(window.SB)return SBA.signup(f);
    const d=new FormData(f),email=d.get('email').trim().toLowerCase();
    if(d.get('pw')!==d.get('pw2'))return setErr('autherr','The two passwords do not match.');
    if(db.users.some(u=>u.email===email))return setErr('autherr','That email already has an account. Log in instead.');
    const u={id:uid('u'),name:d.get('name').trim(),email,hash:await hash(email,d.get('pw')),country:d.get('country'),phone:(d.get('phone')||'').trim(),bio:'',joined:Date.now(),points:0,contacts:[],following:[],favs:[],tasks:{},claimed:[]};
    db.users.push(u);db.session=u.id;save();afterLogin(u,true,'signup');
  },
  async login(f){
    if(window.SB)return SBA.login(f);
    const d=new FormData(f),email=d.get('email').trim().toLowerCase(),u=db.users.find(x=>x.email===email&&!x.seed);
    if(!u||u.hash!==await hash(email,d.get('pw')))return setErr('autherr','Email or password is incorrect.');
    db.session=u.id;save();afterLogin(u,d.get('remember')==='on','login');
  },
  profile(f){const d=new FormData(f),m=me();m.name=d.get('name').trim();m.country=d.get('country');m.phone=d.get('phone').trim();m.bio=d.get('bio').trim();save();closeModal();render();toast('Profile saved')},
  async upload(f){
    const d=new FormData(f),m=me(),btn=f.querySelector('button');btn.disabled=true;
    try{
      const img=await fileToImg(d.get('img'));let hasVid=false,url=null;const v=d.get('vid');
      if(v&&v.size){const info=await videoInfo(v);if(info.dur<14.5||info.dur>30.5){btn.disabled=false;return setErr('uperr',`Video is ${Math.round(info.dur)} s. Use a clip between 15 and 30 seconds.`)}hasVid=true;url=info.url}
      const w={id:uid('w'),uid:m.id,title:d.get('title').trim(),cat:d.get('cat'),img,hasVid,created:Date.now(),updates:[],ratings:[],comments:[],views:0,shares:0};
      db.works.push(w);if(url)vids[w.id]=url;
      if(!save()){db.works.pop();btn.disabled=false;return}
      addPoints(m.id,10,'artwork uploaded');bump('upload');save();closeModal();render();
    }catch(e){btn.disabled=false;setErr('uperr',e.message)}
  },
  async update(f){
    const d=new FormData(f),w=getW(f.dataset.id);
    try{w.updates.push({img:await fileToImg(d.get('img')),note:d.get('note').trim(),t:Date.now()});
      addPoints(w.uid,5,'artwork updated');bump('update');save();render();workModal(w.id)}catch(e){setErr('uperr',e.message)}
  },
  comment(f){
    if(!requireLogin())return;const d=new FormData(f),w=getW(f.dataset.id),m=me(),type=d.get('type');
    w.comments.push({u:m.id,type,text:d.get('text').trim(),t:Date.now()});
    if(type!=='comment'&&w.uid!==m.id){addPoints(m.id,2,'helpful suggestion');bump('suggest')}
    save();render();workModal(w.id);
  },
  enter(f){const d=new FormData(f),wid=d.get('w');if(!wid)return;const w=getW(wid),ch=challenge();ch.entries.push({wid,uid:w.uid,cat:f.dataset.c,base:0,votes:{}});addPoints(w.uid,15,'challenge entry');save();closeModal();render()},
  battle(f){
    const d=new FormData(f),a=getW(d.get('a')),b=getW(d.get('b'));
    if(!b)return setErr('uperr','No opponent artworks available yet.');
    if(a.cat!==b.cat)return setErr('uperr','Both artworks must be in the same category.');
    db.battles.unshift({id:uid('b'),a:a.id,b:b.id,start:Date.now(),end:Date.now()+ +d.get('dur')*60000,base:{a:0,b:0},votes:{},resolved:false});save();closeModal();render();
  },
  async sell(f){
    const d=new FormData(f),m=me();
    try{db.listings.unshift({id:uid('l'),uid:m.id,title:d.get('title').trim(),cat:d.get('cat'),price:+d.get('price'),desc:d.get('desc').trim(),img:await fileToImg(d.get('img')),created:Date.now()});
      if(save()){closeModal();render();toast('Listed. Buyers can now message you.')}else db.listings.shift()}catch(e){setErr('uperr',e.message)}
  },
  comm(f){
    const d=new FormData(f),m=me(),total=+d.get('total');
    db.commissions.unshift({id:uid('c'),buyer:m.id,artist:d.get('artist'),title:d.get('title').trim(),brief:d.get('brief').trim(),total,created:Date.now(),ms:MS_DEF.map((x,i)=>({pct:x[1],state:i?'locked':'active'}))});
    save();closeModal();location.hash='#/commissions';render();toast('Order placed. Funds are held in escrow (simulated).');
  },
  async mssubmit(f){
    const d=new FormData(f),c=db.commissions.find(x=>x.id===f.dataset.c),s=c.ms[+f.dataset.i],im=d.get('img');
    s.note=d.get('note').trim();if(im&&im.size)s.img=await fileToImg(im,700);s.state='submitted';s.at=Date.now();delete s.changes;save();closeModal();render();
  },
  mschanges(f){const c=db.commissions.find(x=>x.id===f.dataset.c),s=c.ms[+f.dataset.i];s.state='active';s.changes=new FormData(f).get('text').trim();save();closeModal();render()},
  contact(f){
    const d=new FormData(f),name=d.get('name').trim(),email=d.get('email').trim(),phone=d.get('phone').trim();
    if(!email&&!phone)return setErr('uperr','Add an email or a phone number.');
    const id=f.dataset.id,m=me();
    if(id){const c=m.contacts.find(x=>x.id===id);if(c){Object.assign(c,{name,email,phone,note:d.get('note').trim()});save();toast('Contact updated')}}
    else saveContact({name,email,phone,note:d.get('note').trim(),uid:d.get('uid')});
    closeModal();render();
  },
  async cgroup(f){
    const name=new FormData(f).get('name').trim();if(!name)return;
    try{const tid=await C.createGroup(name);closeModalQuiet();if(route().page!=='chat')location.hash='#/chat';
      const wait=()=>{const t=C.thr(tid);if(t){C.pendingOpen=null;C.open(tid);setTimeout(()=>A.cinvite(),150)}else setTimeout(wait,150)};wait()}
    catch(e){toast('Could not create the group: '+((e&&(e.code||e.message))||'error'))}
  },
  cjoin(f){C.joinGroup(new FormData(f).get('code'))},
  async unlock(f){const pin=new FormData(f).get('pin');const err=await C.tryUnlock(f.dataset.t,pin);const el=$('#pinerr');if(el)el.textContent=err},
  async pinset(f){
    const d=new FormData(f),a=String(d.get('pin')),b=String(d.get('pin2')),after=f.dataset.after;
    if(!/^\d{4,8}$/.test(a))return setErr('pinerr2','Use 4 to 8 digits.');
    if(a!==b)return setErr('pinerr2','The two PINs do not match.');
    const salt=b64e(crypto.getRandomValues(new Uint8Array(16)));
    try{localStorage.setItem('artmark_pin_'+C.me,JSON.stringify({salt,hash:await pinHash(a,salt)}))}catch(e){return setErr('pinerr2','Could not save the PIN here.')}
    closeModalQuiet();toast('PIN saved');if(after)C.lockThread(after);
  },
  csharecontact(f){
    const d=new FormData(f),email=d.get('email').trim(),phone=d.get('phone').trim();
    if(!email&&!phone)return setErr('uperr','Add an email or a phone number to share.');
    closeModal();C.sendTo(C.cur,{type:'contact',card:{name:d.get('name').trim(),email,phone}});toast('Contact card sent');
  },
  async csend(f){
    const i=f.elements['text'],text=i.value.trim();if(!text||!C.cur)return;
    i.value='';C.draft='';const e=$('#emo');if(e)e.hidden=true;i.focus();await C.send(text);
  }

};
document.addEventListener('submit',e=>{const f=e.target,h=F[f.dataset.form];if(h){e.preventDefault();A._last=null;h(f)}});
try{const th=localStorage.getItem('artmark_theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
load();
if(!remembered()&&!window.SB){db.session=null;try{localStorage.removeItem('artmark_norem')}catch(e){}save()}
render();
if(window.SB)SBA.init();
</script>
</body>
</html>
